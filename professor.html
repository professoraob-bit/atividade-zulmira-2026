<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel do Professor — Zulmira de Novais</title><link rel="stylesheet" href="./styles.css"></head>
<body>
<header class="header"><div class="head">
  <div class="school">ESCOLA MUNICIPAL ZULMIRA DE NOVAIS</div>
  <div class="title">PAINEL DE EDUCAÇÃO FÍSICA</div>
  <div class="teacher">PROF. ARTHUR BARBOSA</div>
</div></header>
<main class="wrap">
<section id="loginCard" class="card narrow">
  <h1>Login do professor</h1>
  <form id="login">
    <label for="email">E-mail</label><input id="email" type="email" required>
    <label for="senha">Senha</label><input id="senha" type="password" required>
    <button class="button primary full">Entrar</button>
    <p id="loginError" class="error" hidden></p>
  </form>
</section>

<section id="panel" hidden>
  <div class="card">
    <div class="panelHead"><div><h1>Criar atividade</h1><p class="muted">Escolha o ano e o conteúdo que os alunos deverão responder.</p></div><button id="sair" class="button secondary">Sair</button></div>
    <div id="currentActivity" class="activeBox">Carregando...</div>
    <div class="creator">
      <div><label for="atividadeAno">Ano</label><select id="atividadeAno"><option>6º ano</option><option>7º ano</option></select></div>
      <div><label for="atividadeConteudo">Conteúdo</label><select id="atividadeConteudo"></select></div>
      <button id="ativarAtividade" class="button primary">Disponibilizar atividade</button>
    </div>
    <p id="activitySuccess" class="successMsg" hidden></p>
    <p id="activityError" class="error" hidden></p>
  </div>

  <div class="card">
    <div class="panelHead"><div><h1>Resultados</h1><p id="total" class="muted"></p></div></div>
    <div class="filters">
      <div><label>Turma</label><select id="fTurma"><option value="">Todas</option><option>6º ano A</option><option>6º ano B</option><option>6º ano C</option><option>7º ano A</option><option>7º ano B</option><option>7º ano C</option></select></div>
      <div><label>Turno</label><select id="fTurno"><option value="">Todos</option><option>Manhã</option><option>Tarde</option></select></div>
      <div><label>Data</label><input id="fData" type="date"></div>
      <div class="filterBtns"><button id="limpar" class="button secondary">Limpar</button><button id="exportar" class="button primary">CSV</button></div>
    </div>
    <div class="tableWrap"><table>
      <thead><tr><th>Nome</th><th>Turma</th><th>Turno</th><th>Conteúdo</th><th>Acertos</th><th>%</th><th>Data/hora</th></tr></thead>
      <tbody id="body"></tbody>
    </table></div>
    <p id="panelError" class="error" hidden></p>
  </div>

  <section id="detail" class="card" hidden>
    <div class="panelHead"><div><h2 id="detailName"></h2><p id="detailSummary" class="muted"></p></div><button id="fechar" class="button secondary">Fechar</button></div>
    <div id="detailQs"></div>
  </section>
</section>
</main>
<script type="module" src="./professor.js"></script>
</body></html>
